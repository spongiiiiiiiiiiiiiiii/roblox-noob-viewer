<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roblox Inspired Baseplate</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#8ed6f0;font-family:Arial}#hud{position:fixed;z-index:2;top:14px;left:16px;color:#fff;text-shadow:0 2px 4px #234;font-weight:bold}#hint{font-size:13px;font-weight:normal}</style></head><body><div id="hud">Baseplate World<div id="hint">WASD / arrows: walk · Space: jump · drag: look · scroll: zoom</div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script><script>
if(!window.THREE){document.getElementById('hint').textContent='Three.js did not load. Connect to the internet and refresh.'}else{const T=THREE,scene=new T.Scene();scene.background=new T.Color(0x8ed6f0);scene.fog=new T.Fog(0x8ed6f0,70,150);const cam=new T.PerspectiveCamera(70,innerWidth/innerHeight,.1,300);const ren=new T.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.shadowMap.enabled=true;document.body.appendChild(ren.domElement);scene.add(new T.HemisphereLight(0xffffff,0x5c7d58,2.1));const sun=new T.DirectionalLight(0xffffff,2.8);sun.position.set(-30,50,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const base=new T.Mesh(new T.BoxGeometry(80,1,80),new T.MeshLambertMaterial({color:0x4f9f45}));base.position.y=-.5;base.receiveShadow=true;scene.add(base);const grid=new T.GridHelper(80,40,0x3d8138,0x6bb25d);grid.position.y=.015;scene.add(grid);
const player=new T.Group();player.position.set(0,0,8);scene.add(player);let model=null;new T.FBXLoader().load('https://raw.githubusercontent.com/spongiiiiiiiiiiiiiiii/roblox-noob-viewer/main/r6_rigged.fbx',g=>{model=g;const box=new T.Box3().setFromObject(model),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3());model.position.sub(center);model.scale.setScalar(2.2/Math.max(size.y,.001));model.position.y=1.1;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});player.add(model);if(g.animations&&g.animations.length){const m=new T.AnimationMixer(model);g.animations.forEach(a=>m.clipAction(a).play());model.userData.mixer=m}},null,()=>{document.getElementById('hint').textContent='FBX could not load; check the GitHub file.'});setInterval(()=>{if(model&&model.userData.mixer)model.userData.mixer.update(.016)},16);
// Roblox-like blocky animation rig used to make the movement visibly animated even if the GLB has no clips.
const rig=new T.Group();player.add(rig);function part(w,h,d,c,x,y,z){let m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshLambertMaterial({color:c}));m.position.set(x,y,z);m.castShadow=true;rig.add(m);return m}const torso=part(1.05,1.3,.55,0x1976d2,0,1.55,0),head=part(.9,.9,.9,0xffc48b,0,2.65,0),armL=part(.32,1.15,.38,0xffc48b,-.72,1.55,0),armR=part(.32,1.15,.38,0xffc48b,.72,1.55,0),legL=part(.38,1.2,.45,0x263238,-.28,.35,0),legR=part(.38,1.2,.45,0x263238,.28,.35,0);rig.visible=false;
const keys={};onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')e.preventDefault()};onkeyup=e=>keys[e.key.toLowerCase()]=false;let yaw=0,pitch=.18,zoom=8,drag=false,lx=0,ly=0;ren.domElement.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY};onpointerup=()=>drag=false;onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-lx)*.006;pitch=T.MathUtils.clamp(pitch-(e.clientY-ly)*.004,-.15,.8);lx=e.clientX;ly=e.clientY};ren.domElement.onwheel=e=>zoom=T.MathUtils.clamp(zoom+e.deltaY*.01,4,14);
let vy=0,grounded=true,last=performance.now(),walkTime=0;function animate(){requestAnimationFrame(animate);const now=performance.now(),dt=Math.min((now-last)/1000,.033);last=now;let f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),r=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),moving=f||r;let len=Math.hypot(f,r)||1;f/=len;r/=len;const forward=new T.Vector3(Math.sin(yaw),0,Math.cos(yaw)),right=new T.Vector3(Math.cos(yaw),0,-Math.sin(yaw)),move=forward.clone().multiplyScalar(-f).add(right.multiplyScalar(r));if(move.lengthSq())move.normalize();const speed=7;player.position.addScaledVector(move,speed*dt);player.position.x=T.MathUtils.clamp(player.position.x,-38,38);player.position.z=T.MathUtils.clamp(player.position.z,-38,38);if(moving)player.rotation.y=Math.atan2(move.x,move.z);
if(keys[' ']&&grounded){vy=9;grounded=false}vy-=24*dt;player.position.y+=vy*dt;if(player.position.y<=0){player.position.y=0;vy=0;grounded=true}if(moving&&grounded)walkTime+=dt*10;const swing=moving&&grounded?Math.sin(walkTime)*.65:0;armL.rotation.x=swing;armR.rotation.x=-swing;legL.rotation.x=-swing;legR.rotation.x=swing;rig.position.y=moving&&grounded?Math.abs(Math.sin(walkTime*2))*.04:0;rig.rotation.z=moving&&grounded?Math.sin(walkTime)*.025:0;if(model){model.position.y=moving&&grounded?Math.abs(Math.sin(walkTime*2))*.045:0;model.rotation.z=moving&&grounded?Math.sin(walkTime)*.02:0}
const target=player.position.clone();target.y+=1.7;const cp=Math.cos(pitch),sp=Math.sin(pitch);cam.position.set(target.x+Math.sin(yaw)*cp*zoom,target.y+sp*zoom,target.z+Math.cos(yaw)*cp*zoom);cam.lookAt(target);ren.render(scene,cam)}animate();onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)}}
</script></body></html>
