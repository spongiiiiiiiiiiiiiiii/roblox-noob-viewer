<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Roblox Noob 3D Model</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #111827; color: #f9fafb; font: 16px system-ui, sans-serif; }
    main { width: min(100vw, 900px); height: min(100vh, 700px); display: grid; grid-template-rows: auto 1fr; }
    h1 { margin: 18px 24px 8px; font-size: 1.1rem; font-weight: 600; }
    model-viewer { width: 100%; height: 100%; background: radial-gradient(circle at 50% 35%, #374151, #111827 70%); }
    p { margin: 0 24px 14px; color: #cbd5e1; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <div><h1>Roblox Noob</h1><p>Drag to rotate · scroll or pinch to zoom</p></div>
    <model-viewer src="roblox-noob.glb" camera-controls auto-rotate shadow-intensity="1" exposure="1" alt="A 3D Roblox noob model"></model-viewer>
  </main>
</body>
</html>
